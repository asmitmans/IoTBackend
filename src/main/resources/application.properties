spring.application.name=IoTBackend

#Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:iotdb}
spring.datasource.username=${POSTGRES_USER:iotuser}
spring.datasource.password=${POSTGRES_PASSWORD:iotpass}

#JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false